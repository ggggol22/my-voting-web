<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дауыс Беру Жүйесі</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1540910419391-709dca716d87?q=80&w=2070');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 50px 40px;
            width: 380px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-weight: 300;
            margin-bottom: 35px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 22px;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 13px;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            outline: none;
            box-sizing: border-box;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #00c6ff;
        }

        option {
            background: #1a1a1a;
            color: white;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 114, 255, 0.4);
        }

        .link {
            display: inline-block;
            margin-top: 30px;
            color: #00c6ff;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.8;
            transition: 0.3s;
        }

        .link:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1>Тұлғаларға дауыс беру</h1>
        <form action="/vote" method="post">
            <div class="input-group">
                <label>Сіздің есіміңіз</label>
                <input name="voter" type="text" placeholder="Атыңызды енгізіңіз" required>
            </div>
            <div class="input-group">
                <label>Таңдауыңыз</label>
                <select name="candidate">
                    <option value="A">👤 1-тұлға</option>
                    <option value="B">👤 2-тұлға</option>
                </select>
            </div>
            <button type="submit">Дауыс беруді растау</button>
        </form>
        <a href="/results" class="link">Нәтижелерді бақылау</a>
    </div>
</body>
</html>
